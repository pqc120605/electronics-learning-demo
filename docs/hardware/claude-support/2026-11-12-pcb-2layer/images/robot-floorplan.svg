<text x="20" y="26" text-anchor="start" fill="#111" font-size="16" font-weight="bold">MoBot robot EVT0 r2 — floorplan dự kiến</text><text x="20" y="46" text-anchor="start" fill="#b03030" font-size="11.5" font-weight="bold">Minh họa bố trí, chưa phải layout đã route · tỉ lệ 6 px = 1 mm · khung 90 × 70 mm · nhìn từ mặt trên (TOP)</text><rect x="70" y="80" width="540" height="420" rx="18" fill="#e7f1e4" stroke="#1d5c2a" stroke-width="2"/><rect x="382" y="80" width="204" height="90" fill="#ffe1e1" stroke="#b03030" stroke-width="1.3" stroke-dasharray="6 4"/><text x="484.0" y="122.5" text-anchor="middle" fill="#111" font-size="10.5" font-weight="bold">Cấm đồng (anten)</text><text x="484.0" y="134.5" text-anchor="middle" fill="#111" font-size="9.5">34 × 15 mm</text><rect x="382" y="170" width="204" height="282" fill="#dfe9fb" stroke="#2b4c7e" stroke-width="1.3"/><text x="484.0" y="302.5" text-anchor="middle" fill="#111" font-size="10.5" font-weight="bold">B01 ESP32 DevKit</text><text x="484.0" y="314.5" text-anchor="middle" fill="#111" font-size="9.5">vùng 34 × 62 mm</text><text x="484.0" y="326.5" text-anchor="middle" fill="#111" font-size="9.5">3 hàng socket</text><rect x="400" y="200" width="168" height="216" fill="#fdebd2" stroke="#b3641b" stroke-width="1.3" stroke-dasharray="6 4"/><text x="484.0" y="293.5" text-anchor="middle" fill="#111" font-size="10.5" font-weight="bold">Dưới bo (≤ 2 mm):</text><text x="484.0" y="305.5" text-anchor="middle" fill="#111" font-size="9.5">TPS2553 + CC</text><text x="484.0" y="317.5" text-anchor="middle" fill="#111" font-size="9.5">UVLO · AND</text><text x="484.0" y="329.5" text-anchor="middle" fill="#111" font-size="9.5">buck 3,3 V</text><rect x="382" y="452" width="204" height="48" fill="#ffe1e1" stroke="#b03030" stroke-width="1.3" stroke-dasharray="6 4"/><text x="484.0" y="479.5" text-anchor="middle" fill="#111" font-size="10.5" font-weight="bold">Trống: đầu cắm USB-C của B01</text><rect x="118" y="86" width="60" height="36" fill="#f