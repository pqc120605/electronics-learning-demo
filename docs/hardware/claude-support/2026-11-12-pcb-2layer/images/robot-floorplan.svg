"91.0" y1="70" x2="589.0" y2="70" stroke="#555" marker-start="url(#a)" marker-end="url(#a)"/><text x="340.0" y="65" text-anchor="middle" fill="#444" font-size="10.5">tâm lỗ 83 mm · 4 × M3 (Ø3,2 mm), tâm cách mép 3,5 mm</text><line x1="58" y1="101.0" x2="58" y2="479.0" stroke="#555" marker-start="url(#a)" marker-end="url(#a)"/><text x="52" y="290.0" text-anchor="middle" font-size="10.5" fill="#444" transform="rotate(-90 52 290.0)">tâm lỗ 63 mm</text><text x="20" y="558" text-anchor="start" fill="#444" font-size="10.5">Mặt dưới (BOTTOM): mặt đồng GND liền. Hướng tiến: cạnh trên. J_CHG = chỉ sạc; J_SRC = chỉ cấp cho B01.</text><text x="20" y="574" text-anchor="start" fill="#444" font-size="10.5">Mật độ cao hơn r1 (thêm BQ25886, TPS63070). 90 × 70 mm là ước lượng trước khi route; nếu DRC không đạt sẽ báo lại.</text>
