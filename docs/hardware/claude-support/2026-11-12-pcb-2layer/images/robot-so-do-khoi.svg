<text x="20" y="26" text-anchor="start" fill="#111" font-size="16" font-weight="bold">MoBot robot EVT0 r2 — sơ đồ khối</text><rect x="20" y="60" width="120" height="60" rx="5" fill="#fdf1e3" stroke="#b3641b" stroke-width="1.4"/><text x="80.0" y="79.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Pack 2S Li-ion</text><text x="80.0" y="94.0" text-anchor="middle" fill="#111" font-size="11">có PCM</text><text x="80.0" y="109.0" text-anchor="middle" fill="#111" font-size="11">6,4–8,4 V</text><rect x="165" y="60" width="120" height="60" rx="5" fill="#fdeaea" stroke="#b03030" stroke-width="1.4"/><text x="225.0" y="79.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Bảo vệ vào</text><text x="225.0" y="94.0" text-anchor="middle" fill="#111" font-size="11">PTC · P-FET</text><text x="225.0" y="109.0" text-anchor="middle" fill="#111" font-size="11">· công tắc</text><rect x="310" y="60" width="120" height="60" rx="5" fill="#fdf1e3" stroke="#b3641b" stroke-width="1.4"/><text x="370.0" y="79.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Buck 5 V</text><text x="370.0" y="94.0" text-anchor="middle" fill="#111" font-size="11">TPS54302</text><text x="370.0" y="109.0" text-anchor="middle" fill="#111" font-size="11">EN ← EN_NODE</text><rect x="455" y="60" width="130" height="60" rx="5" fill="#fdf1e3" stroke="#b3641b" stroke-width="1.4"/><text x="520.0" y="86.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Nguồn USB-C</text><text x="520.0" y="101.5" text-anchor="middle" fill="#111" font-size="11">TPS2553 + CC</text><rect x="610" y="60" width="140" height="60" rx="5" fill="#fffbe0" stroke="#8a7a12" stroke-width="1.4"/><text x="680.0" y="79.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">J_SRC USB-C cái</text><text x="680.0" y="94.0" text-anchor="middle" fill="#111" font-size="11">→ cáp C–C →</text><text x="680.0" y="109.0" text-anchor="middle" fill="#111" font-size="11">USB-C của