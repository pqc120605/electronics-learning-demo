0" x2="405" y2="160" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="250" width="150" height="56" rx="5" fill="#fdf1e3" stroke="#b3641b" stroke-width="1.4"/><text x="95.0" y="267.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Buck-boost 6 V</text><text x="95.0" y="282.0" text-anchor="middle" fill="#111" font-size="11">TPS63070</text><text x="95.0" y="297.0" text-anchor="middle" fill="#111" font-size="11">→ VM_6V</text><rect x="20" y="330" width="150" height="60" rx="5" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.4"/><text x="95.0" y="349.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">DRV8833</text><text x="95.0" y="364.0" text-anchor="middle" fill="#111" font-size="11">chop 0,26–0,39 A/kênh</text><text x="95.0" y="379.0" text-anchor="middle" fill="#111" font-size="11">220 µF + TVS</text><rect x="20" y="415" width="150" height="44" rx="5" fill="#f3f3f3" stroke="#666" stroke-width="1.4"/><text x="95.0" y="441.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">2 × motor N20 6 V</text><line x1="95" y1="306" x2="95" y2="330" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="95" y1="390" x2="95" y2="415" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="298" y1="120" x2="298" y2="235" stroke="#b3641b" stroke-width="1.6"/><line x1="298" y1="235" x2="95" y2="235" stroke="#b3641b" stroke-width="1.6"/><line x1="95" y1="235" x2="95" y2="250" stroke="#b3641b" stroke-width="1.6" marker-end="url(#a)"/><rect x="300" y="300" width="220" height="160" rx="5" fill="#e9f6ec" stroke="#2e7d43" stroke-width="1.4"/><text x="410.0" y="361.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">B01 · ESP32 DevKit 30 chân</text><text x="410.0" y="376.5" text-anchor="middle" fill="#111" font-size="11">VIN, EN: KHÔNG NỐI</text><text x="410.0" y="391.5" text-anchor="middle" fill="#111" font-size="11">nguồn qua USB-C của bo</text><text x="410.0" y="406.5" text-anchor="middle" fill="#111" font-size="11">Wi-Fi / Web Serial</text><line x1="300" y1="345" x2="170" y2="345" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="235" y="339" text-anchor="middle" fill="#444" font-size="10.5">AIN1/2, BIN1/2 (1 kΩ)</text><line x1="300" y1="370" x2="170" y2="290" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="236" y="318" text-anchor="middle" fill="#444" font-size="10.5">MOT_EN → AND → EN, nSLEEP</text><line x1="170" y1="380" x2="300" y2="400" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="236" y="410" text-anchor="middle" fill="#444" font-size="10.5">ISEN_A/B, nFAULT</text><rect x="560" y="180" width="190" height="46" rx="5" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.4"/><text x="655.0" y="199.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">OLED SSD1306 I²C</text><text x="655.0" y="214.5" text-anchor="middle" fill="#111" font-size="11">V3V3_C · GPIO21/22</text><line x1="560" y1="203" x2="520" y2="315" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="560" y="236" width="190" height="46" rx="5" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.4"/><text x="655.0" y="255.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">HC-SR04 (5 V)</text><text x="655.0" y="270.5" text-anchor="middle" fill="#111" font-size="11">TRIG 23 · ECHO chia áp → 34</text><line x1="560" y1="259" x2="520" y2="315" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="560" y="292" width="190" height="46" rx="5" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.4"/><text x="655.0" y="311.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">2 × TCRT5000</text><text x="655.0" y="326.5" text-anchor="middle" fill="#111" font-size="11">V3V3_C · DO → 35, 32</text><line x1="560" y1="315" x2="520" y2="315" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="560" y="348" width="190" height="46" rx="5" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.4"/><text x="655.0" y="367.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Module MAX98357A + loa 8 Ω</text><text x="655.0" y="382.5" text-anchor="middle" fill="#111" font-size="11">5 V · I²S 26/25/27</text><line x1="560" y1="371" x2="520" y2="371" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="560" y="404" width="190" height="46" rx="5" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.4"/><text x="655.0" y="423.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Đo VBAT (chia áp)</text><text x="655.0" y="438.5" text-anchor="middle" fill="#111" font-size="11">→ GPIO33 (ADC1)</text><line x1="560" y1="427" x2="520" y2="427" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="690" y1="120" x2="690" y2="152" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="690" y1="152" x2="540" y2="152" stroke="#333" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="540" y1="152" x2="480" y2="300" stroke="#333" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="600" y="146" text-anchor="middle" fill="#444" font-size="10.5">cáp USB-C–C</text><text x="20" y="490" text-anchor="start" fill="#444" font-size="11">Hai cổng USB-C trên carrier: J_CHG (chỉ sạc) và J_SRC (chỉ cấp cho B01). In nhãn rõ trên silkscreen.</text>
