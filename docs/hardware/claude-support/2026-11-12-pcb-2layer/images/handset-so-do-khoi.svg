<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 510" width="780" height="510" font-family="Arial, Helvetica, sans-serif" font-size="12">
<title>Sơ đồ khối tay cầm r2</title>
<rect width="780" height="510" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<text x="20" y="26" text-anchor="start" fill="#111" font-size="16" font-weight="bold">MoBot tay cầm EVT0 r3 — sơ đồ khối</text><rect x="20" y="60" width="120" height="60" rx="5" fill="#fdf1e3" stroke="#b3641b" stroke-width="1.4"/><text x="80.0" y="79.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">3 × AA (chính)</text><text x="80.0" y="94.0" text-anchor="middle" fill="#111" font-size="11">tháo rời</text><text x="80.0" y="109.0" text-anchor="middle" fill="#111" font-size="11">3,2–4,8 V</text><rect x="170" y="60" width="130" height="60" rx="5" fill="#fdeaea" stroke="#b03030" stroke-width="1.4"/><text x="235.0" y="79.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Bảo vệ vào</text><text x="235.0" y="94.0" text-anchor="middle" fill="#111" font-size="11">PTC 2 A · P-FET</text><text x="235.0" y="109.0" text-anchor="middle" fill="#111" font-size="11">· JP2 · công tắc</text><rect x="330" y="60" width="120" height="60" rx="5" fill="#fdf1e3" stroke="#b3641b" stroke-width="1.4"/><text x="390.0" y="79.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Buck-boost 3,38 V</text><text x="390.0" y="94.0" text-anchor="middle" fill="#111" font-size="11">TPS631000</text><text x="390.0" y="109.0" text-anchor="middle" fill="#111" font-size="11">EN ← UVLO</text><rect x="480" y="60" width="130" height="60" rx="5" fill="#fdf1e3" stroke="#b3641b" stroke-width="1.4"/><text x="545.0" y="79.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">TPS2553</text><text x="545.0" y="94.0" text-anchor="middle" fill="#111" font-size="11">hạn dòng, chặn ngược</text><text x="545.0" y="109.0" text-anchor="middle" fill="#111" font-size="11">0,61–0,73 A</text><rect x="640" y="60" width="110" height="60" rx="5" fill="#fffbe0" stroke="#8a7a12" stroke-width="1.4"/><text x="695.0" y="79.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Chân 3V3</text><text x="695.0" y="94.0" text-anchor="middle" fill="#111" font-size="11">của B01</text><text x="695.0" y="109.0" text-anchor="middle" fill="#111" font-size="11">3,25–3,45 V</text><rect x="330" y="160" width="120" height="56" rx="5" fill="#fdeaea" stroke="#b03030" stroke-width="1.4"/><text x="390.0" y="177.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">UVLO</text><text x="390.0" y="192.0" text-anchor="middle" fill="#111" font-size="11">TLV6710</text><text x="390.0" y="207.0" text-anchor="middle" fill="#111" font-size="11">cắt 3,17–3,24 V</text><line x1="140" y1="90" x2="170" y2="90" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="300" y1="90" x2="330" y2="90" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="315.0" y="85.0" text-anchor="middle" fill="#444" font-size="10.5">VBAT_SW</text><line x1="450" y1="90" x2="480" y2="90" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="465.0" y="78" text-anchor="middle" fill="#444" font-size="10.5">3V3_BB</text><line x1="610" y1="90" x2="640" y2="90" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="625.0" y="78" text-anchor="middle" fill="#444" font-size="10.5">3V3_DEV</text><line x1="390" y1="160" x2="390" y2="120" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="404" y="145" text-anchor="middle" fill="#444" font-size="10.5">EN</text><line x1="315" y1="90" x2="315" y2="188" stroke="#333" stroke-width="1.6"/><line x1="315" y1="188" x2="330" y2="188" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="160" width="280" height="76" rx="5" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/><text x="160.0" y="179.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Tùy chọn LiPo 1S — DNP ở EVT0</text><text x="160.0" y="194.5" text-anchor="middle" fill="#111" font-size="11">J_CHG USB-C (chỉ sạc, Rd 5,1 kΩ × 2) → BQ24072</text><text x="160.0" y="209.5" text-anchor="middle" fill="#111" font-size="11">→ J_LIPO (4,16–4,23 V) · OUT → JP2</text><text x="160.0" y="224.5" text-anchor="middle" fill="#111" font-size="11">ICHG 0,27 A · vào ≤ 0,5 A</text><line x1="235" y1="160" x2="235" y2="120" stroke="#333" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><rect x="300" y="290" width="220" height="160" rx="5" fill="#e9f6ec" stroke="#2e7d43" stroke-width="1.4"/><text x="410.0" y="344.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">B01 · ESP32 DevKit 30 chân</text><text x="410.0" y="359.0" text-anchor="middle" fill="#111" font-size="11">cắm socket 2 × 15</text><text x="410.0" y="374.0" text-anchor="middle" fill="#111" font-size="11">3V3 ← V3V3_DEV · VIN hở</text><text x="410.0" y="389.0" text-anchor="middle" fill="#111" font-size="11">USB-C của bo: cắm lúc nào</text><text x="410.0" y="404.0" text-anchor="middle" fill="#111" font-size="11">cũng an toàn</text><line x1="695" y1="120" x2="695" y2="270" stroke="#333" stroke-width="1.6"/><line x1="695" y1="270" x2="520" y2="300" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="280" width="190" height="56" rx="5" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.4"/><text x="135.0" y="297.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">2 × joystick (4 trục)</text><text x="135.0" y="312.0" text-anchor="middle" fill="#111" font-size="11">biến trở 10 kΩ</text><text x="135.0" y="327.0" text-anchor="middle" fill="#111" font-size="11">→ GPIO36/39/34/35</text><rect x="40" y="350" width="190" height="56" rx="5" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.4"/><text x="135.0" y="374.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">8 × nút nhấn xuống GND</text><text x="135.0" y="389.5" text-anchor="middle" fill="#111" font-size="11">→ 13/33/25/26/27/18/19/23</text><rect x="40" y="420" width="190" height="50" rx="5" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.4"/><text x="135.0" y="441.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Chia áp pin 100k/100k</text><text x="135.0" y="456.5" text-anchor="middle" fill="#111" font-size="11">VBAT_SW → GPIO32 (ADC1)</text><line x1="230" y1="308" x2="300" y2="320" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="265.0" y="302" text-anchor="middle" fill="#444" font-size="10.5">1 kΩ + 100 nF</text><line x1="230" y1="378" x2="300" y2="378" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="265.0" y="373.0" text-anchor="middle" fill="#444" font-size="10.5">1 kΩ</text><line x1="230" y1="440" x2="300" y2="430" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="570" y="330" width="190" height="80" rx="5" fill="#fffbe0" stroke="#8a7a12" stroke-width="1.4"/><text x="665.0" y="351.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">J_UART header 1×4, 2,54 mm</text><text x="665.0" y="366.5" text-anchor="middle" fill="#111" font-size="11">GND · TX0 · RX0 · EN</text><text x="665.0" y="381.5" text-anchor="middle" fill="#111" font-size="11">nạp: giữ BOOT trên DevKit,</text><text x="665.0" y="396.5" text-anchor="middle" fill="#111" font-size="11">nhấn EN</text><line x1="570" y1="370" x2="520" y2="370" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="20" y="495" text-anchor="start" fill="#444" font-size="11">Carrier không có rail 5 V nên không thể đẩy điện ra cổng USB. LiPo + BQ24072 có trong nguyên lý và footprint, không lắp ở EVT0.</text>
</svg>
