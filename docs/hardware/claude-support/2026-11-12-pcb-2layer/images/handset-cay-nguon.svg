<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450" font-family="Arial, Helvetica, sans-serif" font-size="12">
<title>Cây nguồn tay cầm r2</title>
<rect width="780" height="450" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<text x="20" y="26" text-anchor="start" fill="#111" font-size="16" font-weight="bold">MoBot tay cầm EVT0 r3 — cây nguồn</text><rect x="20" y="70" width="120" height="56" rx="5" fill="#fdf1e3" stroke="#b3641b" stroke-width="1.4"/><text x="80.0" y="87.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">VBAT 3 × AA</text><text x="80.0" y="102.0" text-anchor="middle" fill="#111" font-size="11">3,2–4,8 V</text><text x="80.0" y="117.0" text-anchor="middle" fill="#111" font-size="11">đỉnh 0,93 A</text><rect x="165" y="70" width="105" height="56" rx="5" fill="#fdeaea" stroke="#b03030" stroke-width="1.4"/><text x="217.5" y="87.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">F1 PTC</text><text x="217.5" y="102.0" text-anchor="middle" fill="#111" font-size="11">MF-MSMF200/8X</text><text x="217.5" y="117.0" text-anchor="middle" fill="#111" font-size="11">1,50 A @60 °C</text><rect x="295" y="70" width="105" height="56" rx="5" fill="#fdeaea" stroke="#b03030" stroke-width="1.4"/><text x="347.5" y="94.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Q1 P-FET</text><text x="347.5" y="109.5" text-anchor="middle" fill="#111" font-size="11">DMG2305UX</text><rect x="425" y="70" width="90" height="56" rx="5" fill="#f3f3f3" stroke="#666" stroke-width="1.4"/><text x="470.0" y="94.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">JP2</text><text x="470.0" y="109.5" text-anchor="middle" fill="#111" font-size="11">AA | LiPo</text><rect x="540" y="70" width="90" height="56" rx="5" fill="#fdeaea" stroke="#b03030" stroke-width="1.4"/><text x="585.0" y="94.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">SW1</text><text x="585.0" y="109.5" text-anchor="middle" fill="#111" font-size="11">≥ 2 A DC</text><rect x="655" y="70" width="100" height="56" rx="5" fill="#f3f3f3" stroke="#666" stroke-width="1.4"/><text x="705.0" y="102.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">VBAT_SW</text><line x1="140" y1="98" x2="165" y2="98" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="270" y1="98" x2="295" y2="98" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="400" y1="98" x2="425" y2="98" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="515" y1="98" x2="540" y2="98" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="630" y1="98" x2="655" y2="98" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="295" y="150" width="220" height="50" rx="5" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/><text x="405.0" y="171.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">DNP: J_CHG → BQ24072 → J_LIPO</text><text x="405.0" y="186.5" text-anchor="middle" fill="#111" font-size="11">OUT = VBAT + 0,225 V (≥ 3,4 V khi sạc)</text><line x1="470" y1="150" x2="470" y2="126" stroke="#333" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="5 4"/><line x1="705" y1="126" x2="705" y2="225" stroke="#333" stroke-width="1.6"/><line x1="705" y1="225" x2="120" y2="225" stroke="#333" stroke-width="1.6"/><line x1="120" y1="225" x2="120" y2="250" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="330" y1="225" x2="330" y2="250" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><line x1="560" y1="225" x2="560" y2="250" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="250" width="160" height="60" rx="5" fill="#fdeaea" stroke="#b03030" stroke-width="1.4"/><text x="120.0" y="269.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">U2 TLV6710 UVLO</text><text x="120.0" y="284.0" text-anchor="middle" fill="#111" font-size="11">Iq ≤ 11 µA</text><text x="120.0" y="299.0" text-anchor="middle" fill="#111" font-size="11">+ cầu chia ≈ 50 µA</text><rect x="250" y="250" width="160" height="60" rx="5" fill="#fdf1e3" stroke="#b3641b" stroke-width="1.4"/><text x="330.0" y="276.5" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">U1 TPS631000</text><text x="330.0" y="291.5" text-anchor="middle" fill="#111" font-size="11">→ V3V3_BB 3,31–3,45 V</text><rect x="480" y="250" width="160" height="60" rx="5" fill="#eef3fb" stroke="#2b4c7e" stroke-width="1.4"/><text x="560.0" y="269.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Chia áp đo pin</text><text x="560.0" y="284.0" text-anchor="middle" fill="#111" font-size="11">100k / 100k → GPIO32</text><text x="560.0" y="299.0" text-anchor="middle" fill="#111" font-size="11">≈ 24 µA</text><line x1="200" y1="280" x2="250" y2="280" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="225.0" y="275.0" text-anchor="middle" fill="#444" font-size="10.5">EN</text><line x1="330" y1="310" x2="330" y2="340" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="250" y="340" width="160" height="56" rx="5" fill="#fdf1e3" stroke="#b3641b" stroke-width="1.4"/><text x="330.0" y="357.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">U3 TPS2553</text><text x="330.0" y="372.0" text-anchor="middle" fill="#111" font-size="11">0,61–0,73 A</text><text x="330.0" y="387.0" text-anchor="middle" fill="#111" font-size="11">rò ngược ≤ 1 µA</text><line x1="410" y1="368" x2="460" y2="368" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="460" y="335" width="290" height="70" rx="5" fill="#e9f6ec" stroke="#2e7d43" stroke-width="1.4"/><text x="605.0" y="359.0" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Chân 3V3 của B01 (≥ 3,25 V ở 0,5 A)</text><text x="605.0" y="374.0" text-anchor="middle" fill="#111" font-size="11">TB 0,13 A · đỉnh 0,5 A [chưa đo]</text><text x="605.0" y="389.0" text-anchor="middle" fill="#111" font-size="11">→ ESP32 + joystick 1,3 mA</text><text x="20" y="432" text-anchor="start" fill="#444" font-size="11">Tắt SW1: mọi thứ sau công tắc mất nguồn. Cắm USB của DevKit ở mọi trạng thái SW1 đều không đẩy dòng vào pin hay ra máy tính.</text>
</svg>
