name: Verify Mạch Mở web and API
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web-and-api:
    runs-on: ubuntu-24.04
    env:
      VITE_MACHMO_SELF_HOSTED_OAUTH: 'true'
      VITE_MACHMO_SELF_HOSTED_ANALYTICS: 'true'
      VITE_MACHMO_SITE_FEEDBACK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test server/api/*.test.mjs
      - run: npm run build:public
      - run: |
          sudo apt-get update
          sudo apt-get install -y caddy
          for mode in default --enable-ai; do
            args=()
            if [[ "$mode" != default ]]; then args+=("$mode"); fi
            node server/api/production-edge.mjs "${args[@]}" > "$RUNNER_TEMP/machmo.Caddyfile"
            caddy validate --config "$RUNNER_TEMP/machmo.Caddyfile" --adapter caddyfile
          done
